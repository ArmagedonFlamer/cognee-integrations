name: cognee
kind: exclusive
version: 1.4.0
description: "Cognee knowledge-graph memory for Hermes: recall, remember, forget and session-end improvement. After installing, run `hermes memory setup cognee` to make it your memory provider: remote mode (Cognee Cloud URL + API key) works as is; local mode also needs the cognee package (cognee==1.6.5) installed in Hermes's environment."
hooks:
  - on_session_end
  - on_pre_compress
  - on_memory_write
